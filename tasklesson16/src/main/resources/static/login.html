<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .alert {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
        }

        .alert-error {
            background-color: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .alert-success {
            background-color: #efe;
            color: #3c3;
            border: 1px solid #cfc;
        }

        .info-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 5px;
            border-left: 4px solid #667eea;
        }

        .info-box h3 {
            color: #667eea;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .info-box p {
            font-size: 13px;
            color: #666;
            margin: 5px 0;
        }

        .info-box code {
            background-color: #e9ecef;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>🔐 Вход в систему</h2>
        
        <script>
            // Показываем сообщения об ошибках и выходе
            window.onload = function() {
                const urlParams = new URLSearchParams(window.location.search);
                const alertDiv = document.getElementById('alert-message');
                if (urlParams.has('error')) {
                    alertDiv.innerHTML = '<div class="alert alert-error">❌ Неверное имя пользователя или пароль</div>';
                } else if (urlParams.has('logout')) {
                    alertDiv.innerHTML = '<div class="alert alert-success">✅ Вы успешно вышли из системы</div>';
                }
            };
        </script>
        
        <div id="alert-message"></div>
        
        <form action="/login" method="post">
            <div class="form-group">
                <label for="username">Имя пользователя</label>
                <input type="text" 
                       id="username" 
                       name="username" 
                       placeholder="Введите имя пользователя"
                       required 
                       autofocus/>
            </div>
            
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" 
                       id="password" 
                       name="password" 
                       placeholder="Введите пароль"
                       required/>
            </div>
            
            <div class="form-group">
                <button type="submit">Войти</button>
            </div>
        </form>
        
        <div class="info-box">
            <h3>📝 Тестовые учетные данные</h3>
            <p><strong>Пользователь:</strong> <code>user</code> / <code>user</code></p>
            <p><strong>Администратор:</strong> <code>admin</code> / <code>admin</code></p>
        </div>
    </div>
</body>
</html>
