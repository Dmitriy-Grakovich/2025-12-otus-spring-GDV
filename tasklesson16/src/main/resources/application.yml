
spring:
  application:
    name: tasklesson16

  datasource:
    url: jdbc:h2:mem:testdb
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    generate-ddl: false
    hibernate:
      ddl-auto: none

    show-sql: true

  liquibase:
    enabled: true
    contexts: production
  main:
    allow-bean-definition-overriding: true

  server:
    port: 8080
    servlet:
      context-path: /api

  logging:
    level:
      liquibase: INFO
      ru.diasoft.spring: DEBUG

# JWT Configuration
jwt:
  secret: mySecretKeyForJWTTokenGenerationAndValidationMustBeLongEnoughForHS256Algorithm
  expiration: 86400000 # 24 часа в миллисекундах
