spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  liquibase:
    enabled: false

  sql:
    init:
      mode: always

jwt:
  secret: testSecretKeyForUnitTestsOnly12345678901234567890
  access:
    expiration: 3600000
  refresh:
    expiration: 86400000

logging:
  level:
    com.bookloverbox: DEBUG