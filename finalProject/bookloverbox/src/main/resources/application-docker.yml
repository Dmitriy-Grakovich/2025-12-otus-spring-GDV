spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:bookloverbox}
    username: ${DB_USER:booklover}
    password: ${DB_PASSWORD:secret}
    hikari:
      connection-timeout: 30000
      initialization-fail-timeout: 60000

  jpa:
    hibernate:
      ddl-auto: update  # ВАЖНО: отключаем Hibernate DDL
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    enabled: false
    change-log: classpath:db/changelog/db.changelog-master.yaml
    drop-first: false
    default-schema: public
    # Добавляем контексты
    contexts: docker,development
    # Увеличиваем таймаут
    database-change-log-lock-wait-time: 5
    # Логирование
    parameters:
      liquibase.command.verbose: true

logging:
  level:
    ru.diasoft.bookloverbox: DEBUG
    liquibase: DEBUG
    org.springframework.boot.autoconfigure.liquibase: DEBUG
    org.springframework.boot.context.embedded: DEBUG