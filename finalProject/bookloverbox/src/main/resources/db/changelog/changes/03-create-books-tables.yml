databaseChangeLog:
  - changeSet:
      id: 3
      author: dev
      changes:
        # Таблица жанров
        - createTable:
            tableName: genres
            columns:
              - column: { name: id, type: bigint, autoIncrement: true, constraints: { primaryKey: true } }
              - column: { name: name, type: varchar(50), constraints: { unique: true, nullable: false } }
              - column: { name: description, type: varchar(255) }

        # Таблица книг
        - createTable:
            tableName: books
            columns:
              - column: { name: id, type: bigint, autoIncrement: true, constraints: { primaryKey: true } }
              - column: { name: title, type: varchar(200), constraints: { nullable: false } }
              - column: { name: description, type: text }
              - column: { name: content, type: text }
              - column: { name: cover_url, type: varchar(500) }
              - column: { name: price, type: decimal(10,2), defaultValueNumeric: 0 }
              - column: { name: status, type: varchar(20), defaultValue: "DRAFT" }
              - column: { name: author_id, type: bigint }
              - column: { name: genre_id, type: bigint }
              - column: { name: created_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP }
              - column: { name: published_at, type: timestamp }
              - column: { name: age_rating, type: varchar(20) }
              - column: { name: views_count, type: bigint, defaultValueNumeric: 0 }
              - column: { name: downloads_count, type: bigint, defaultValueNumeric: 0 }

        # Внешние ключи для книг
        - addForeignKeyConstraint:
            constraintName: fk_book_author
            baseTableName: books
            baseColumnNames: author_id
            referencedTableName: users
            referencedColumnNames: id

        - addForeignKeyConstraint:
            constraintName: fk_book_genre
            baseTableName: books
            baseColumnNames: genre_id
            referencedTableName: genres
            referencedColumnNames: id

        # Добавление缺失ных полей в таблицу books
        -addColumn:
            tableName: books
            columns:
              - column: { name: updated_at, type: timestamp }
              - column: { name: publisher, type: varchar(200) }
              - column: { name: page_count, type: bigint }
              - column: { name: copyright_holder, type: varchar(200) }
              - column: { name: isbn, type: varchar(20) }

        # Таблица отзывов
        - createTable:
            tableName: reviews
            columns:
              - column: { name: id, type: bigint, autoIncrement: true, constraints: { primaryKey: true } }
              - column: { name: book_id, type: bigint }
              - column: { name: user_id, type: bigint }
              - column: { name: rating, type: int, constraints: { nullable: false } }
              - column: { name: comment, type: text }
              - column: { name: created_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP }

        # Внешние ключи для отзывов
        - addForeignKeyConstraint:
            constraintName: fk_review_book
            baseTableName: reviews
            baseColumnNames: book_id
            referencedTableName: books
            referencedColumnNames: id

        - addForeignKeyConstraint:
            constraintName: fk_review_user
            baseTableName: reviews
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id