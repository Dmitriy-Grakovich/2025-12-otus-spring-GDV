version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bookloverbox-postgres
    environment:
      POSTGRES_DB: bookloverbox
      POSTGRES_USER: booklover
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bookloverbox-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booklover -d bookloverbox"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookloverbox-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: bookloverbox
      DB_USER: booklover
      DB_PASSWORD: secret
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bookloverbox-network
    restart: unless-stopped

networks:
  bookloverbox-network:
    driver: bridge

volumes:
  postgres_data:
