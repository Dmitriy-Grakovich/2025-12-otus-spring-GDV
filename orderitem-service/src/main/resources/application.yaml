spring:
  application:
    name: orderitem-service

server:
  port: 8081

logging:
  level:
    ru.diasoft.orderitemservice: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
